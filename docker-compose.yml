version: '3.8'

services:
  web:
    build: .
    expose:
      - "8000"
    volumes:
      - static_files:/app/staticfiles
    env_file:
      - .env
    restart: always
    networks:
      - shared

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
      - static_files:/app/staticfiles
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      - web
    restart: always
    networks:
      - shared

volumes:
  static_files:

networks:
  shared:
    name: shared_network