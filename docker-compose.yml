version: '3.8'

services:
  web:
    build: .
    expose:
      - "8000"
    volumes:
      - static_files:/app/staticfiles
    env_file:
      - .env
    restart: always
    networks:
      - shared

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
      - static_files:/app/staticfiles
      - littlelemon_static:/app/littlelemon_staticfiles
      - bassinga_static:/app/bassinga_staticfiles
      - motomeet_static:/app/motomeet_staticfiles
      - motomeet_media:/app/motomeet_media
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      - web
    restart: always
    networks:
      - shared

volumes:
  static_files:
  littlelemon_static:
    external: true
  bassinga_static:
    external: true
  motomeet_static:
    external: true
  motomeet_media:
    external: true

networks:
  shared:
    name: shared_network