{% extends 'website/base.html' %}
{% load static %}

{% block title %}Contact — Bas Schreurs{% endblock %}

{% block content %}

<form action="https://formsubmit.co/2f133f8d80bb0265415c5ead493ab61e" method="POST" class="contact-form">

  <input type="hidden" name="_next" value="https://basschreurs.nl/home/" />
  <input type="hidden" name="_captcha" value="false">
  <input type="hidden" name="_subject" value="New message from portfolio">
  <input type="hidden" name="_template" value="table">

  <h2>Stuur een bericht</h2>

  <label for="name">Uw naam:</label>
  <input type="text" id="name" name="name" required />

  <label for="email">Uw email:</label>
  <input type="email" id="email" name="email" required />

  <label for="message">Uw bericht:</label>
  <textarea id="message" name="message" rows="10" required></textarea>

  <button type="submit">Stuur</button>
</form>

{% endblock %}
